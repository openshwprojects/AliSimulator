name: Self-tests

on:
  push:
  pull_request:
  # By hand, optionally on the Unicorn engine: its suite takes about seven
  # times longer than the C++ core's and no longer fits a job on every push
  # (dropped from the push runs on 2026-11-04, see docs/development_notes.md).
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine: cpp (the default) or unicorn"
        type: choice
        options: [cpp, unicorn]
        default: cpp

# The HTML report (with the screens the tests rendered) is published to GitHub
# Pages from report/cpp/.  The repository's Pages source must be set to
# "GitHub Actions" once (Settings -> Pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let a run finish rather than cancelling.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ENGINE: ${{ inputs.engine || 'cpp' }}

jobs:
  test:
    name: Tests (${{ inputs.engine || 'cpp' }} engine)
    runs-on: ubuntu-latest
    # The C++ suite is about half an hour; a Unicorn run by hand needs hours.
    timeout-minutes: ${{ inputs.engine == 'unicorn' && 360 || 90 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install unicorn capstone numpy pillow

      # cpp/build.sh: g++ -> cpp/build/libalicore.so (src/cpp_core.py loads it),
      # then the core's own tests (they run dump.bin and ali_sdk.bin).
      - name: Build the C++ core
        run: |
          sh cpp/build.sh
          cpp/build/alicore_tests

      # The report is written even when tests fail - a failing report is the
      # useful one; the real outcome is reflected after it is uploaded.  --slow
      # adds the firmware runs that render screens, four at a time on the
      # runner's cores.  --timeout kills a test that never gets there: 15 min
      # on the C++ core, which boots a box in seconds; an hour on Unicorn,
      # whose screen tests take minutes each.
      - name: Run all tests (writes the report)
        id: tests
        run: |
          set +e
          if [ "$ENGINE" = unicorn ]; then
            python run_all_tests.py --slow --jobs 4 --timeout 3600 --engine unicorn
          else
            python run_all_tests.py --slow --jobs 4 --timeout 900 --engine cpp
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ env.ENGINE }}
          path: ${{ env.ENGINE == 'unicorn' && 'report' || 'report/cpp' }}

      # Pushes only: pull requests (especially from forks) cannot deploy Pages,
      # and a Unicorn run by hand must not replace the C++ report on the site.
      - name: Upload the report as the Pages artifact
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/cpp

      - name: Reflect the test outcome
        if: ${{ always() }}
        run: exit ${{ steps.tests.outputs.exit_code || 1 }}

  deploy:
    needs: test
    # always(): publish the report even if tests failed.  Push-only.
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
